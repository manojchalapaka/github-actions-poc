name: POC - AWS Keyless OIDC Authentication

on:
  workflow_dispatch:

permissions:
  id-token: write   # Required for requesting the JWT token from GitHub
  contents: read

jobs:
  verify-oidc-connection:
    name: Test OIDC Login to AWS
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate with AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::648377377983:role/github-actions-oidc-role
          role-session-name: GitHubActionsOIDCSession
          aws-region: us-east-1

      - name: Verify AWS Keyless Access
        run: |
          echo "=========================================="
          echo "SUCCESSFULLY LOGGED INTO AWS VIA OIDC!"
          echo "=========================================="
          aws sts get-caller-identity
          echo "=========================================="
          echo "Listing S3 Buckets without any passwords or keys:"
          aws s3 ls
          echo "=========================================="
